services:
  room:
    platform: linux/amd64
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      HTTPS_DOMAIN: ${HTTPS_DOMAIN:?Set HTTPS_DOMAIN in .env}
      SSB_PORT: ${SSB_PORT:-8008}
    ports:
      - "127.0.0.1:3000:3000"
      - "${SSB_PORT:-8008}:8008"
    volumes:
      - ./ssb-go-room-secrets:/app/data/ssb-go-room
